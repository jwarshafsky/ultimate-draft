<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>Ultimate Draft</title>
  <link rel="stylesheet" href="css/app.css?v=144">
  <link rel="icon" href="assets/favicon.svg">
</head>
<body>
  <div id="auth-gate" class="auth-gate">
    <div class="auth-card">
      <h1>Ultimate Draft</h1>
      <p class="auth-sub">Personal draft tool. Sign in to continue.</p>
      <div id="auth-msg" class="auth-msg" hidden></div>
      <button id="auth-google" class="btn primary">Sign in with Google</button>
      <div class="auth-divider">or</div>
      <div class="auth-email-row">
        <input id="auth-email" type="email" placeholder="you@example.com" autocomplete="email">
        <button id="auth-magic" class="btn">Send magic link</button>
      </div>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">UD</span>
        <span class="brand-name">Ultimate Draft</span>
        <span id="brand-sub" class="brand-sub"></span>
      </div>
      <nav class="tabs">
        <button class="tab active" data-view="overview">Overview</button>
        <button class="tab" data-view="standings">Standings</button>
        <button class="tab" data-view="keepers">Keepers</button>
        <button class="tab" data-view="values">Values</button>
        <button class="tab" data-view="hotfa">Hot FAs</button>
        <button class="tab" data-view="board">Board</button>
        <button class="tab" data-view="compare">Compare</button>
        <button class="tab" data-view="trade">Trade</button>
        <button class="tab" data-view="scenarios">Scenarios</button>
        <button class="tab" data-view="mock">Mock Draft</button>
        <button class="tab" data-view="draft">Live Draft</button>
        <button class="tab" data-view="roster">Roster</button>
        <button class="tab" data-view="history">History</button>
        <button class="tab" data-view="data">Data</button>
        <button class="tab" data-view="settings">Settings</button>
      </nav>
      <div class="topbar-right">
        <span id="inflation-badge" class="badge">infl —</span>
        <button id="sign-out" class="btn ghost" title="Sign out">⎋</button>
      </div>
    </header>

    <main id="view-root" class="view-root">
      <div class="loading">Loading league data…</div>
    </main>

    <footer class="statusbar">
      <span id="status-supabase" class="status">supabase: —</span>
      <span id="status-projections" class="status">projections: —</span>
      <span id="status-draft" class="status">draft: idle</span>
      <span id="status-sync" class="status">sync: —</span>
      <span class="status-spacer"></span>
      <span id="status-build" class="status">v0.1</span>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0"></script>
  <script src="js/data/supabase-client.js?v=144"></script>
  <script src="js/data/cloud-sync.js?v=144"></script>
  <script src="js/data/league-data.js?v=144"></script>
  <script src="js/data/projections.js?v=144"></script>
  <script src="js/data/ros-projections.js?v=144"></script>
  <script src="js/data/espn.js?v=144"></script>
  <script src="js/data/draft-log.js?v=144"></script>
  <script src="js/data/statcast.js?v=144"></script>
  <script src="js/data/fangraphs-xwoba.js?v=144"></script>
  <script src="js/data/nfbc.js?v=144"></script>
  <script src="js/data/notes.js?v=144"></script>
  <script src="js/data/strategy.js?v=144"></script>
  <script src="js/data/rotowire.js?v=144"></script>
  <script src="js/data/draft-history.js?v=144"></script>
  <script src="js/data/my-keepers.js?v=144"></script>
  <script src="js/data/league-rosters.js?v=144"></script>
  <script src="js/data/draft-dollars.js?v=144"></script>
  <script src="js/data/budget-adjust.js?v=144"></script>
  <script src="js/core/valuation.js?v=144"></script>
  <script src="js/core/inflation.js?v=144"></script>
  <script src="js/core/invariants.js?v=144"></script>
  <script src="js/core/surplus.js?v=144"></script>
  <script src="js/core/standings.js?v=144"></script>
  <script src="js/core/mock-engine.js?v=144"></script>
  <script src="js/core/mock-interactive.js?v=144"></script>
  <script src="js/features/category.js?v=144"></script>
  <script src="js/features/standings.js?v=144"></script>
  <script src="js/features/nominations.js?v=144"></script>
  <script src="js/features/ai-assistant.js?v=144"></script>
  <script src="js/features/endgame.js?v=144"></script>
  <script src="js/features/inflation-curve.js?v=144"></script>
  <script src="js/features/pace.js?v=144"></script>
  <script src="js/features/compare.js?v=144"></script>
  <script src="js/features/scenarios.js?v=144"></script>
  <script src="js/features/roster.js?v=144"></script>
  <script src="js/features/grade.js?v=144"></script>
  <script src="js/features/history.js?v=144"></script>
  <script src="js/features/overview.js?v=144"></script>
  <script src="js/features/keepers.js?v=144"></script>
  <script src="js/features/values.js?v=144"></script>
  <script src="js/features/hotfa.js?v=144"></script>
  <script src="js/features/board.js?v=144"></script>
  <script src="js/features/trade.js?v=144"></script>
  <script src="js/features/mock.js?v=144"></script>
  <script src="js/features/draft-setup.js?v=144"></script>
  <script src="js/features/draft.js?v=144"></script>
  <script src="js/features/draft-mode.js?v=144"></script>
  <script src="js/features/debrief.js?v=144"></script>
  <script src="js/features/data.js?v=144"></script>
  <script src="js/features/settings.js?v=144"></script>
  <script src="js/app.js?v=144"></script>
</body>
</html>
