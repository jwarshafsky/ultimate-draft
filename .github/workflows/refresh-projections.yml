name: Refresh ROS projections

# Pulls Steamer ROS / THE BAT X ROS / ATC ROS from FanGraphs and commits the
# CSVs the app loads. Runs on GitHub's runners (never the user's machine/IP),
# weekly + on manual dispatch. FanGraphs throttles bursts, so the fetch script
# spaces requests out; weekly low-volume access stays under the radar.

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC (~9am ET)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-projections
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch projections
        run: python3 scripts/fetch_ros_projections.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain projections)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add projections
            git commit -m "Auto-refresh ROS projections"
            git push
            echo "Committed updated projections."
          else
            echo "No projection changes."
          fi
